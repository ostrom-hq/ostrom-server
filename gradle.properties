org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=true
# Apple targets only build on macOS; a Linux host (CI) skips macosArm64 instead of failing.
kotlin.native.ignoreDisabledTargets=true
# The runner shares its PTY interop (cinterop) between the native targets of nativeMain.
kotlin.mpp.enableCInteropCommonization=true
# build-logic ostrom.kmp: no native target, the server runs on the JVM (docs/decisions/0001). The runner overrides it
# in runner/gradle.properties.
ostrom.nativeTargets=
