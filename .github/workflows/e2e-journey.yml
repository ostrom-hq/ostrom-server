name: E2E journey

# ostrom-e2e's scenarios (scenarios/*.e2e.ts: the journey of demo/PARCOURS.md, budgets, attestation…) against a
# PUBLISHED image of this server: the image named, or by default the newest `sha-<7>` of main's last commits published,
# never `edge`, which names no commit. A PARCOURS cell is ✅ only on such a run (JOURNAL 03/11): the bench of
# ostrom-e2e builds main from its Dockerfile, which proves an e2e pull request, not the image that ships. It runs in
# this repository because its token reads its own GHCR packages, which ostrom-e2e's cannot yet (as cli-journey.yml).
# On demand, and, off the org's one-`ci`-job rule on purpose (as cli-journey.yml), on a pull request only when the
# pull request changes this file.
on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Server image (empty = the newest ghcr.io/ostrom-hq/ostrom-server:sha-<7> of main published)
        default: ""
      e2e_ref:
        description: ostrom-e2e ref whose scenarios run
        default: main
      files:
        description: >-
          Scenario files, space-separated, relative to ostrom-e2e
          (`scenarios/budget.e2e.ts scenarios/attestation.e2e.ts`); empty = every scenarios/*.e2e.ts.
        default: ""
      tests:
        description: >-
          Scenarios to run in those files, a test-name filter (`E2E-PARC-013`, `E2E-BUDGET`); empty = all of them. Every
          scenario the filter names must pass: a skipped one fails the run.
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [.github/workflows/e2e-journey.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  journey:
    name: journey
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env: { POSTGRES_USER: ostrom, POSTGRES_PASSWORD: ostrom, POSTGRES_DB: ostrom_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom_ci" --health-interval 5s --health-timeout 5s --health-retries 20
      # Billing creates the organization's customer: stripe-mock answers it, as on ostrom-e2e's bench.
      stripe:
        # latest, 2026-10-01 (as ostrom-e2e)
        image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
        ports: ['12111:12111']
    env:
      WANTED_IMAGE: ${{ inputs.server_image }}
      E2E_REF: ${{ inputs.e2e_ref || 'main' }}
      # A pull request that changes this file proves it on one scenario of the main journey (3.2, the gate of a rule).
      FILES: ${{ github.event_name == 'pull_request' && 'scenarios/parcours.e2e.ts' || inputs.files }}
      TESTS: ${{ github.event_name == 'pull_request' && 'E2E-PARC-013' || inputs.tests }}
    steps:
      # The whole history: main's head names the image, and the image's own commit gives its database roles.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: server
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-e2e
          ref: ${{ env.E2E_REF }}
          ssh-key: ${{ secrets.DEPLOY_KEY_E2E }}
          path: e2e
          persist-credentials: false
      - name: The server image (the newest sha-<7> of main published, unless named)
        id: server
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          main=$(git -C server rev-parse origin/main)
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=$WANTED_IMAGE
          if [ -z "$image" ]; then
            # as cli-journey.yml: a head whose image failed or is still building is skipped; any other error stops.
            for commit in $(git -C server rev-list --first-parent --max-count=10 origin/main); do
              candidate=ghcr.io/ostrom-hq/ostrom-server:sha-${commit:0:7}
              if error=$(docker pull --quiet "$candidate" 2>&1 >/dev/null); then
                image=$candidate
                break
              fi
              case "$error" in
                *"manifest unknown"* | *"not found"*) echo "$candidate is not published yet" ;;
                *) echo "::error::$candidate cannot be pulled: $error"; exit 1 ;;
              esac
            done
            [ -n "$image" ] || { echo "::error::no sha-<7> image of main's last 10 commits can be pulled"; exit 1; }
          else
            docker pull --quiet "$image" || { echo "::error::$image cannot be pulled"; exit 1; }
          fi
          revision=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          [ -n "$revision" ] || { echo "::error::$image carries no org.opencontainers.image.revision label"; exit 1; }
          git -C server cat-file -e "${revision}^{commit}" 2>/dev/null \
            || { echo "::error::$image is ostrom-server@${revision:0:7}, a commit not in the history of main"; exit 1; }
          git -C server show "${revision}:ci/database-roles.sql" > "$RUNNER_TEMP/database-roles.sql"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "### Images"
            echo "- server: \`$image\` (ostrom-server@${revision:0:7}; main is at ${main:0:7})"
            echo "- scenarios: ostrom-e2e $(git -C e2e rev-parse --short HEAD) ($E2E_REF)"
            echo "- files: \`${FILES:-scenarios/*.e2e.ts}\`, filter: \`${TESTS:-all}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the server (roles, migrate, serve as ostrom_app)
        env:
          IMAGE: ${{ steps.server.outputs.image }}
          PGPASSWORD: ostrom
          OWNER_URL: postgresql://ostrom_owner:ostrom_owner@localhost:5432/ostrom
        run: |
          psql -h localhost -U ostrom -d ostrom_ci -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/database-roles.sql"
          docker run --rm --network host -e OSTROM_DATABASE_MIGRATION_URL="$OWNER_URL" "$IMAGE" migrate
          # The server's non-root user writes the sign-in mails (0644); the scenarios, as the runner's user, read them.
          mkdir -p "$RUNNER_TEMP/ostrom-mail" && chmod 0777 "$RUNNER_TEMP/ostrom-mail"
          # Test values only, as ostrom-e2e's bench: mails to a directory, the console is the server's own origin, the
          # scenarios' addresses come through the trusted local proxy, Stripe is stripe-mock.
          cat > "$RUNNER_TEMP/server.env" <<'ENV'
          OSTROM_DATABASE_URL=postgresql://ostrom_app:ostrom_app@localhost:5432/ostrom
          OSTROM_PORT=4600
          OSTROM_MAIL_DIR=/var/lib/ostrom/mail
          OSTROM_PUBLIC_URL=http://127.0.0.1:4600
          OSTROM_CONSOLE_URL=http://127.0.0.1:4600
          OSTROM_WEB_ORIGIN=http://127.0.0.1:4600
          OSTROM_TRUSTED_PROXIES=127.0.0.1/32
          OSTROM_STRIPE_SECRET_KEY=sk_test_e2e
          OSTROM_STRIPE_WEBHOOK_SECRET=whsec_e2e_bench
          OSTROM_STRIPE_API_BASE=http://127.0.0.1:12111
          ENV
          sed -i 's/^ *//' "$RUNNER_TEMP/server.env"
          docker run -d --name ostrom-server --network host -v "$RUNNER_TEMP/ostrom-mail:/var/lib/ostrom/mail" \
            --env-file "$RUNNER_TEMP/server.env" "$IMAGE"
          for _ in $(seq 1 60); do curl -fsS 127.0.0.1:4600/ready >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs ostrom-server; exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: The journey's scenarios against the server
        working-directory: e2e
        env:
          OSTROM_E2E_SERVER_URL: http://127.0.0.1:4600
          OSTROM_E2E_MAIL_DIR: ${{ runner.temp }}/ostrom-mail
          OSTROM_E2E_CONSOLE_ORIGIN: http://127.0.0.1:4600
        run: |
          pnpm install --frozen-lockfile
          # The files named, or every scenario file; a filter runs its scenarios only; the json report says which ran.
          read -r -a files <<< "${FILES:-}"
          [ "${#files[@]}" -gt 0 ] || files=(scenarios/*.e2e.ts)
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::no scenario file $f in ostrom-e2e@$E2E_REF"; exit 1; }
          done
          pnpm exec vitest run --project e2e "${files[@]}" ${TESTS:+-t "$TESTS"} \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/journey.json"
      - name: Every scenario the filter names ran and passed
        if: always() && env.TESTS != ''
        run: |
          # A probe that finds a route missing skips its scenario, and a skip is green for vitest: not here.
          jq -e --arg t "$TESTS" '
            [.testResults[].assertionResults[] | select(.fullName | contains($t))] as $named
            | ($named | length) > 0 and all($named[]; .status == "passed")
          ' "$RUNNER_TEMP/journey.json" > /dev/null || {
            jq -r --arg t "$TESTS" '.testResults[].assertionResults[] | select(.fullName | contains($t))
              | "::error::\(.status): \(.fullName)"' "$RUNNER_TEMP/journey.json"
            echo "::error::no scenario named $TESTS passed"; exit 1
          }
          jq -r --arg t "$TESTS" '.testResults[].assertionResults[] | select(.fullName | contains($t))
            | "- \(.status): \(.fullName)"' "$RUNNER_TEMP/journey.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Server logs
        if: always()
        run: docker logs ostrom-server 2>&1 | tail -n 300 || true
