name: Runner image

# Builds the cloud session image (runner/Dockerfile) from main when the runner changes, smoke-tests it and pushes it to
# GHCR (private package). Pull requests stay on the one `ci` job (org CI rules), which builds and tests :runner.
on:
  push:
    branches: [main]
    paths: ["runner/**", ".github/workflows/runner-image.yml"]
  workflow_dispatch:

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Runner binary (linuxX64)
        run: ./gradlew :runner:linkReleaseExecutableLinuxX64

      - name: Build context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p image/bin
          cp runner/build/bin/linuxX64/releaseExecutable/ostrom-runner.kexe image/bin/ostrom-runner
          cp runner/Dockerfile image/Dockerfile
          # The ostrom CLI, from its latest release when there is one (the image works without it).
          gh release download -R ostrom-hq/ostrom-cli --pattern 'ostrom-linux-x64*' -D cli 2>/dev/null \
            && find cli -type f -name 'ostrom-linux-x64*' ! -name '*.sha256' -exec cp {} image/bin/ostrom \; || echo "no ostrom CLI release yet"
          ls -l image/bin

      - name: Image
        run: docker build -t ostrom-runner:ci image

      - name: Smoke test (the runner refuses a missing configuration, the agents are installed)
        run: |
          set +e
          docker run --rm ostrom-runner:ci; code=$?
          set -e
          test "$code" = 2
          docker run --rm --entrypoint sh ostrom-runner:ci -c 'claude --version && codex --version && git --version && id -u | grep -x 1000'

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag ostrom-runner:ci "ghcr.io/ostrom-hq/ostrom-runner:$SHA"
          docker tag ostrom-runner:ci ghcr.io/ostrom-hq/ostrom-runner:latest
          docker push "ghcr.io/ostrom-hq/ostrom-runner:$SHA"
          docker push ghcr.io/ostrom-hq/ostrom-runner:latest
