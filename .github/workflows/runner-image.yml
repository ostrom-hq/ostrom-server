name: Runner image

# Builds the cloud session image (runner/Dockerfile) from main when the runner changes, smoke-tests it and pushes it to
# GHCR (private package) and to Docker Hub, docker.io/ostromhq/ostrom-runner (public, as the server image): the
# console's journeys in ostrom-web start their cloud sessions and machines on it, and that repository's token cannot
# read the GHCR package. Pull requests stay on the one `ci` job (org CI rules), which builds and tests :runner.
#
# The image holds the CLI's `ostrom` at /usr/local/bin: the server delivers the binary of its runner image (the cloud
# runtime's, else OSTROM_RUNNERS_IMAGE, this image by default) into each session's /opt/ostrom, and the session's
# containers run `/opt/ostrom/ostrom cloud …`, so this image is the session and the runner image at once, as TeamCode's
# template image is. The binary comes from the CLI's latest release, else is built from ostrom-cli (`cli_ref`, main).
on:
  push:
    branches: [main]
    paths: ["runner/**", ".github/workflows/runner-image.yml"]
  workflow_dispatch:
    inputs:
      cli_ref:
        description: ostrom-cli ref whose `ostrom` the image holds when the CLI has no release yet
        default: main

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Runner binary (linuxX64)
        run: ./gradlew :runner:linkReleaseExecutableLinuxX64

      - name: The ostrom CLI's latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_REF: ${{ inputs.cli_ref || 'main' }}
        run: |
          gh release download -R ostrom-hq/ostrom-cli --pattern 'ostrom-linux-x64*' -D cli-release 2>/dev/null || true
          binary=$(find cli-release -type f -name 'ostrom-linux-x64*' ! -name '*.sha256' 2>/dev/null | head -n 1 || true)
          [ -n "$binary" ] || echo "no ostrom CLI release yet: built from ostrom-cli ${CLI_REF}"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      # Without a release, the CLI's linuxX64 release binary from ostrom-cli, as cli-journey.yml builds it: ostrom-core
      # next to it, at the commit the CLI pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.binary == ''
        with:
          repository: ostrom-hq/ostrom-cli
          ref: ${{ inputs.cli_ref || 'main' }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CLI }}
          path: cli
          persist-credentials: false
      - name: ostrom-core version the CLI pins
        id: core
        if: steps.release.outputs.binary == ''
        run: echo "ref=$(tr -d '[:space:]' < cli/gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.binary == ''
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: ostrom-core
          persist-credentials: false
      - name: The CLI's linuxX64 release binary
        if: steps.release.outputs.binary == ''
        working-directory: cli
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
          ./gradlew -Postrom.core.local=true :cli:linkReleaseExecutableLinuxX64

      - name: Build context
        env:
          RELEASED: ${{ steps.release.outputs.binary }}
        run: |
          cli_binary=${RELEASED:-cli/cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe}
          test -f "$cli_binary" || { echo "::error::no ostrom CLI binary for the image"; exit 1; }
          ci/session-image-context.sh image runner/build/bin/linuxX64/releaseExecutable/ostrom-runner.kexe "$cli_binary"
          ls -l image/bin

      - name: Image
        run: docker build --progress=plain -t ostrom-runner:ci image

      - name: Smoke test (the runner and the machine mode refuse a missing configuration, the agents are installed)
        run: |
          set +e
          docker run --rm ostrom-runner:ci; code=$?
          docker run --rm ostrom-runner:ci machine; machine=$?
          docker run --rm -e OSTROM_SERVER_URL=http://server -e OSTROM_RUNNER_ID=00000000-0000-4000-8000-000000000000 \
            -e OSTROM_RUNNER_KEY_FILE=/nonexistent ostrom-runner:ci machine; unreadable=$?
          set -e
          test "$code" = 2
          test "$machine" = 2
          test "$unreadable" = 2
          docker run --rm --entrypoint sh ostrom-runner:ci -c 'claude --version && codex --version && git --version && id -u | grep -x 1001'

      - name: Smoke test (the image delivers the CLI's ostrom as the server's delivery container runs it)
        run: |
          # The delivery container: the runner's uid, a read-only root, the binary's directory on an empty volume.
          docker volume create ostrom-smoke-bin > /dev/null
          docker run --rm --user 1000:1000 --read-only --tmpfs /tmp -e HOME=/tmp --cap-drop ALL \
            -v ostrom-smoke-bin:/usr/local/bin --entrypoint /usr/local/bin/ostrom ostrom-runner:ci --version
          # A session's container: the copy, read-only at /opt/ostrom, under the agent's uid.
          docker run --rm --user 1001:1000 --read-only --tmpfs /tmp -e HOME=/tmp -v ostrom-smoke-bin:/opt/ostrom:ro \
            --entrypoint /opt/ostrom/ostrom ostrom-runner:ci --version
          docker volume rm ostrom-smoke-bin > /dev/null
          # `ostrom cloud machine` refuses a missing configuration (2), as ostrom-runner machine did.
          set +e
          docker run --rm --entrypoint /usr/local/bin/ostrom ostrom-runner:ci cloud machine; machine=$?
          set -e
          test "$machine" = 2

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag ostrom-runner:ci "ghcr.io/ostrom-hq/ostrom-runner:$SHA"
          docker tag ostrom-runner:ci ghcr.io/ostrom-hq/ostrom-runner:latest
          docker push "ghcr.io/ostrom-hq/ostrom-runner:$SHA"
          docker push ghcr.io/ostrom-hq/ostrom-runner:latest

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ostromhq
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # The same image, public: `sha-<commit>` pins one, `latest` is main's.
      - name: Push to Docker Hub
        env:
          SHA: ${{ github.sha }}
        run: |
          docker tag ostrom-runner:ci "docker.io/ostromhq/ostrom-runner:sha-$SHA"
          docker tag ostrom-runner:ci docker.io/ostromhq/ostrom-runner:latest
          docker push "docker.io/ostromhq/ostrom-runner:sha-$SHA"
          docker push docker.io/ostromhq/ostrom-runner:latest
