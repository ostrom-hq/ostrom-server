name: Push relay image

# Publishes ostromhq/ostrom-push on Docker Hub: the Kotlin/Native push relay (push/README.md), ported from TeamCode's
# `teamcode-push`. A native linuxX64 binary in a Debian image, amd64 only (Cloud Run). The tags are the server image's
# (image.yml): `latest` and `sha-<commit>` from main, `<version>` and `sha-<commit>-<version>` from a bare semver tag.
# The image is built and its contract checked (scripts/smoke-push-relay.py) before anything is pushed; the pushed image
# is signed with cosign by digest, as the server's. Pull requests stay on the one `ci` job (org CI rules), which builds
# and checks the same image. No cache of any kind for what is published (zizmor).
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
    paths:
      - "push/**"
      - "build-logic/**"
      - "gradle/libs.versions.toml"
      - "gradle/ostrom-core.ref"
      - "scripts/smoke-push-relay.py"
      - ".github/workflows/push-image.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: The full SHA of a commit of main to build, instead of the head of the ref
        type: string
        default: ''

# On main a run in progress finishes, so no merged commit loses its image to a later one.
concurrency:
  group: push-image-${{ github.ref }}${{ inputs.sha && format('-{0}', inputs.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: docker.io/ostromhq/ostrom-push
  KOTLIN_VERSION: '2.4.21'
  # The commit built: the manual run's `sha`, else the one that triggered the run.
  SHA: ${{ inputs.sha || github.sha }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read # run.ostrom artifacts of ostrom-core on GitHub Packages
    steps:
      - name: A manual `sha` is a full SHA of a commit of main
        if: inputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA: $SHA" >&2; exit 1; }
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "$SHA is not a commit of main ($status)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/build-setup
        with:
          core-deploy-key: ${{ secrets.DEPLOY_KEY_CORE }}
          kotlin-version: ${{ env.KOTLIN_VERSION }}
          build-cache: native
      # `latest` only while the commit is still main's head, so that a run of an older commit, finished after a newer
      # one, keeps only its `sha-` tag.
      - name: Select the image tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
            # A bare semantic version only: it is the image's tag.
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "not a release tag: $version" >&2
              exit 1
            fi
            tags="${version},sha-${SHA}-${version}"
          else
            tags="sha-${SHA}"
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$SHA" ]; then
              tags="latest,${tags}"
            fi
          fi
          echo "IMAGE_TAGS=$tags" >> "$GITHUB_ENV"
          echo "tags $tags"
      # Two Gradle workers at a time: several Kotlin/Native compilations and links at once exhaust the runner's memory (#13).
      - name: Native binary (linuxX64)
        run: |
          echo 'org.gradle.workers.max=2' >> ~/.gradle/gradle.properties
          ./gradlew :push:linkReleaseExecutableLinuxX64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Image for amd64, and its contract
        run: |
          docker build --platform linux/amd64 --file push/Dockerfile --tag ostrom-push:contract push
          python3 scripts/smoke-push-relay.py ostrom-push:contract
      # Publishing only from main and tags; a dispatch on another branch stops after the contract check.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          registry: docker.io
          username: ostromhq
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Push the image
        id: push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          for tag in $(printf '%s' "$IMAGE_TAGS" | tr ',' ' '); do set -- "$@" --tag "${IMAGE}:${tag}"; done
          docker buildx build --platform linux/amd64 --file push/Dockerfile "$@" --metadata-file "$RUNNER_TEMP/push-image.json" --push push
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/push-image.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "buildx wrote no digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with: { cosign-release: v2.6.5 }
      - name: Sign the image by digest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
      - name: Summary
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "Image: \`${IMAGE}@${DIGEST}\` (linux/amd64)"
            echo
            echo "Tags:"; printf '%s\n' "${IMAGE_TAGS//,/$'\n'}" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
