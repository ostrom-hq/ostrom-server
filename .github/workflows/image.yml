name: Image

# Publishes ostromhq/ostrom-server on Docker Hub from the JVM application of this exact commit (docs/decisions/0001),
# built by jib through the Ktor Gradle plugin as TeamCode's build.yml: `latest` and `sha-<commit>` from main,
# `<version>` and `sha-<commit>-<version>` from a bare semver tag. amd64 and arm64 in one index, built without any
# native link (jib lays the JVM application on eclipse-temurin's multi-architecture base). The amd64 image is
# smoke-tested against PostgreSQL before anything is pushed. The pushed index is signed with cosign by digest (key, no
# public transparency log while the repositories are private); TeamCode does not sign its image. No cache of any kind:
# what is published is built from scratch, never from a cache a pull request could have written (zizmor).
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  # By hand, the image of one commit of main (`sha`): a proof cites the first published image that contains its pull
  # request, and this builds the image of a precise commit when one is missing (JOURNAL 03/11). release-please.yml
  # also dispatches it on a tag it pushed with GITHUB_TOKEN (a tag pushed so starts no workflow).
  workflow_dispatch:
    inputs:
      sha:
        description: The full SHA of a commit of main to build, instead of the head of the ref
        type: string
        default: ''

# One group per ref: on main the run in progress finishes and only the last one waiting is built, so a burst of
# merges builds two images, not one per commit. A commit in between gets no image of its own: a proof cites the first
# published image that contains it, and a manual run with `sha` builds one when needed, in its own group. `latest`
# moves only when the commit is still main's head at publish time (see "Select the image tags").
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.sha && format('-{0}', inputs.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: docker.io/ostromhq/ostrom-server
  # The commit built: the manual run's `sha`, else the one that triggered the run.
  SHA: ${{ inputs.sha || github.sha }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      actions: write # dispatch demo-stack.yml once the image is out
      contents: read
      packages: read # run.ostrom artifacts of ostrom-core on GitHub Packages
    steps:
      - name: A manual `sha` is a full SHA of a commit of main
        if: inputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA: $SHA" >&2; exit 1; }
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "$SHA is not a commit of main ($status)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      # ostrom-core at the pinned commit, read with its read-only deploy key: the GITHUB_TOKEN of this repository can
      # never read the Maven packages of another one (JOURNAL 05:50). Moved next to the workspace, where
      # settings.gradle.kts includes it (ostrom.core.local), so that no check of this repository scans it.
      - name: ostrom-core version
        id: core
        run: echo "ref=$(tr -d '[:space:]' < gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: ostrom-core
          persist-credentials: false
      - name: Build ostrom-core from that checkout
        run: |
          mv ostrom-core ../ostrom-core
          mkdir -p ~/.gradle
          echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-disabled: true }
      # The version the image is (`-PostromVersion`, read back by `/health`, `/api/v1/instance` and
      # `/api/v1/capabilities`, and its OCI label): the tag of a release, `0.0.0-edge.<time>.<sha7>` on main. The tags,
      # TeamCode's: `<version>,sha-<commit>-<version>` on a tag, `latest,sha-<commit>` on main; `latest` only while
      # the commit is still main's head, so that a run of an older commit, finished after a newer one, keeps only its
      # `sha-` tag.
      - name: Select the version and the image tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
            # A bare semantic version only: it is the image's tag, its OCI label and `-PostromVersion`.
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "not a release tag: $version" >&2
              exit 1
            fi
            tags="${version},sha-${SHA}-${version}"
          else
            version="0.0.0-edge.$(date -u +%Y%m%d%H%M%S).${SHA::7}"
            tags="sha-${SHA}"
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$SHA" ]; then
              tags="latest,${tags}"
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE_TAGS=$tags" >> "$GITHUB_ENV"
          echo "version $version, tags $tags"
      - name: Build the amd64 image into Docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -PostromVersion="$VERSION" -PimageRevision="$SHA" -PimagePlatforms=amd64 -PimageTags=smoke \
            :image:publishImageToLocalRegistry
          docker images ostrom-server:smoke --format '{{.Size}}'
      # As deployed (docs/tenancy.md): the owner migrates, the server serves as a role that owns nothing, read-only
      # root and no capability like the chart. arm64 is the same JVM bytecode on the same base image's arm64 variant.
      - name: Smoke test against PostgreSQL
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=postgres postgres:17.6
          for _ in $(seq 1 30); do docker exec pg pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker exec -i pg psql -U postgres -v ON_ERROR_STOP=1 < ci/database-roles.sql
          docker run --rm --network smoke --read-only --cap-drop ALL --tmpfs /tmp \
            -e OSTROM_DATABASE_MIGRATION_URL=postgresql://ostrom_owner:ostrom_owner@pg:5432/ostrom \
            ostrom-server:smoke migrate
          docker run -d --name ostrom-smoke --network smoke -p 8080:8080 --memory 1g \
            --read-only --cap-drop ALL --tmpfs /tmp --tmpfs /var/lib/ostrom:uid=65532,gid=65532 \
            -e OSTROM_DATABASE_URL=postgresql://ostrom_app:ostrom_app@pg:5432/ostrom \
            ostrom-server:smoke
          for _ in $(seq 1 90); do curl -fsS localhost:8080/ready && break; sleep 1; done
          curl -fsS localhost:8080/ready | grep -q '"status":"ready"' || { docker logs ostrom-smoke; exit 1; }
          curl -fsS localhost:8080/health | grep -q '"status":"ok"' || { docker logs ostrom-smoke; exit 1; }
          # Built with this version (-PostromVersion), not a local build's 0.0.0-dev.
          curl -fsS localhost:8080/health | grep -qF "\"version\":\"$VERSION\"" || { docker logs ostrom-smoke; exit 1; }
          curl -fsS localhost:8080/api/v1/instance | grep -q '"algorithm":"ed25519"' || { docker logs ostrom-smoke; exit 1; }
          docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ostrom-server:smoke | grep -qx "$SHA"
          docker stop -t 30 ostrom-smoke
          docker logs ostrom-smoke 2>&1 | grep -q '"msg":"server stopped"'
          docker rm -f ostrom-smoke
          echo "migrate, /ready, /health ($VERSION), /api/v1/instance, graceful stop ok"
      # Publishing only from main and tags; a dispatch on another branch stops after the smoke test.
      - name: Build and push the multi-architecture image (jib)
        id: push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_HUB_USERNAME: ostromhq
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          ./gradlew -PostromVersion="$VERSION" -PimageRevision="$SHA" "-PimageTags=${IMAGE_TAGS}" :image:publishImage
          digest=$(tr -d '[:space:]' < image/build/jib-image.digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "jib wrote no digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with: { cosign-release: v2.6.5 }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          registry: docker.io
          username: ostromhq
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      # The index and, with --recursive, each architecture's image, by digest.
      - name: Sign the index and both images by digest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
      - name: Summary
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "Index: \`${IMAGE}@${DIGEST}\` ($VERSION)"
            echo
            echo "Tags:"; printf '%s\n' "${IMAGE_TAGS//,/$'\n'}" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      # The image just published, run whole in ostrom-helm's local demo stack with the customer's journey
      # (demo-stack.yml), dispatched in a run of its own: this run says only whether the image is published. The smoke
      # test above blocks publication; the demo never does.
      - name: Demo of the image just published, in its own run
        if: github.ref == 'refs/heads/main' && inputs.sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh workflow run demo-stack.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f server_image="${IMAGE}@${DIGEST}" -f after_merge=true
