name: MCP host image

# Builds the MCP stdio host image (mcp-host/Dockerfile, docs/mcp-host.md) for amd64 and arm64, checks its contract
# (scripts/smoke-mcp-host-image.py: probes, token, protocol, real npx and uvx servers, SIGTERM) and, from main only,
# pushes it to GHCR. Pull requests stay on the one `ci` job (org CI rules), which builds and tests :mcp-host; a branch
# is checked by a manual run, which never pushes.
on:
  push:
    branches: [main]
    paths: ["mcp-host/**", "scripts/smoke-mcp-host-image.py", ".github/workflows/mcp-host-image.yml"]
  workflow_dispatch:

concurrency:
  group: mcp-host-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  KOTLIN_VERSION: '2.4.21'

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-setup
        with:
          core-deploy-key: ${{ secrets.DEPLOY_KEY_CORE }}
          kotlin-version: ${{ env.KOTLIN_VERSION }}
          build-cache: jvm

      - name: Host jars
        run: ./gradlew :mcp-host:installHost

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image for amd64, and its contract
        run: |
          docker buildx build --platform linux/amd64 --tag ostrom-mcp-host:ci --load mcp-host
          python3 scripts/smoke-mcp-host-image.py ostrom-mcp-host:ci

      - name: Image for arm64
        run: docker buildx build --platform linux/arm64 mcp-host

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/ostrom-hq/ostrom-mcp-host:$SHA" --tag ghcr.io/ostrom-hq/ostrom-mcp-host:latest \
            --push mcp-host
