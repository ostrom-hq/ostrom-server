name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Stripe's official mock, for the billing gateway's integration test.
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
    env:
      # Database tests run against this service and fail (instead of being skipped) if it is missing.
      OSTROM_TEST_DATABASE_URL: postgresql://localhost:5432/postgres
      OSTROM_TEST_DATABASE_USER: postgres
      OSTROM_TEST_DATABASE_PASSWORD: postgres
      OSTROM_TEST_DATABASE_REQUIRED: "true"
      # Billing: stripe-mock integration, and the end-to-end test against the real Stripe test mode.
      OSTROM_STRIPE_MOCK_URL: http://localhost:12111
      OSTROM_STRIPE_MOCK_REQUIRED: "true"
      OSTROM_STRIPE_E2E_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      OSTROM_STRIPE_E2E_REQUIRED: "true"
      # Reads ostrom-core from GitHub Packages once the server depends on it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v4

      - name: License signing tool (ee/tools/license, 100 % lines and branches)
        working-directory: ee/tools/license
        run: |
          python3 -m venv "$RUNNER_TEMP/license-venv"
          "$RUNNER_TEMP/license-venv/bin/pip" install --quiet coverage==7.6.10 cryptography==44.0.3
          "$RUNNER_TEMP/license-venv/bin/python" -m coverage run --branch --data-file="$RUNNER_TEMP/license.coverage" -m unittest -v test_sign
          "$RUNNER_TEMP/license-venv/bin/python" -m coverage report --data-file="$RUNNER_TEMP/license.coverage" -m --include=sign.py --fail-under=100

      - name: Native tests (linuxX64, with PostgreSQL)
        timeout-minutes: 30
        run: ./gradlew linuxX64Test --continue

      - name: Server binaries (linuxX64, linuxArm64)
        run: ./gradlew :app:linkReleaseExecutableLinuxX64 :app:linkReleaseExecutableLinuxArm64

      - name: Docker image
        run: |
          cp app/build/bin/linuxX64/releaseExecutable/ostrom-server.kexe ostrom-server
          ls -lh ostrom-server app/build/bin/linuxArm64/releaseExecutable/ostrom-server.kexe
          ldd ostrom-server
          docker build -t ostrom-server:ci .
          docker images ostrom-server:ci --format '{{.Size}}'

      - name: Smoke test of the image (/health, /v1/instance)
        run: |
          docker run -d --name ostrom --network host \
            -e OSTROM_DATABASE_URL=postgresql://localhost:5432/postgres \
            -e OSTROM_DATABASE_USER=postgres -e OSTROM_DATABASE_PASSWORD=postgres \
            ostrom-server:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          echo
          curl -fsS localhost:8080/health | grep '"status":"ok"'
          curl -fsS localhost:8080/v1/instance | grep '"algorithm":"ed25519"'
          docker logs ostrom

      - name: Smoke test of the license check (an invalid key fails the start)
        run: |
          set +e
          docker run --name ostrom-bad-license --network host \
            -e OSTROM_DATABASE_URL=postgresql://localhost:5432/postgres \
            -e OSTROM_DATABASE_USER=postgres -e OSTROM_DATABASE_PASSWORD=postgres \
            -e OSTROM_PORT=8081 -e OSTROM_LICENSE_KEY=ostrom-license.v1.not-a-license \
            ostrom-server:ci > license.log 2>&1
          status=$?
          set -e
          cat license.log
          test "$status" = 1
          grep -q 'The license key is malformed' license.log
          if grep -q 'not-a-license' license.log; then echo "The key was logged." >&2; exit 1; fi

      - name: Server logs on failure
        if: failure()
        run: docker logs ostrom || true

      - uses: actions/upload-artifact@v4
        with:
          name: ostrom-server-linux
          path: |
            app/build/bin/linuxX64/releaseExecutable/ostrom-server.kexe
            app/build/bin/linuxArm64/releaseExecutable/ostrom-server.kexe

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      # Last, because it deletes ee/ from the checkout: the AGPL build must compile without the enterprise code, and
      # nothing outside ee/ may name it (app/build.gradle.kts generates the only reference, from ee/ itself).
      - name: AGPL build without ee/
        run: |
          if grep -rn "dev\.ostrom\.server\.ee\." --include='*.kt' --include='*.kts' app kernel modules testing; then
            echo "Code outside ee/ references the enterprise modules." >&2
            exit 1
          fi
          rm -rf ee
          ./gradlew :app:compileKotlinLinuxX64
          grep -q 'listOf<ServerModule>($' app/build/generated/ee-modules/kotlin/dev/ostrom/server/app/EeModules.kt
          if grep -q 'LicenseModule' app/build/generated/ee-modules/kotlin/dev/ostrom/server/app/EeModules.kt; then
            echo "The AGPL build still registers an enterprise module." >&2
            exit 1
          fi
