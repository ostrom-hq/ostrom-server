# CI of ostrom-server, after ostrom-core's reference template (docs/conventions/.github/workflows/build.yml,
# CONVENTIONS section 11). Pull requests and main run on Linux only; macosArm64 is a development target, built on
# version tags only.
name: Build
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
env:
  KOTLIN_VERSION: '2.4.21'
permissions:
  contents: read
  packages: read # dev.ostrom artifacts of ostrom-core on GitHub Packages
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ostrom
          POSTGRES_PASSWORD: ostrom
          POSTGRES_DB: ostrom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ostrom" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OSTROM_TEST_DATABASE_URL: postgresql://ostrom:ostrom@localhost:5432/ostrom_test
      # Database tests fail instead of being skipped when the service is missing: CI never passes by skipping them.
      OSTROM_TEST_DATABASE_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # The Kotlin/Native toolchain and its dependencies (~1 GB) are not in the Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-
      - name: Never serve a test task from the cache (ENG-032)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/always-run-tests.init.gradle.kts <<'KTS'
          allprojects {
              tasks.withType<AbstractTestTask>().configureEach {
                  outputs.cacheIf { false }
                  outputs.upToDateWhen { false }
              }
          }
          KTS
      - name: ostrom-core from source (probe only, its packages are not readable from this repository yet)
        uses: actions/checkout@v4
        with:
          repository: ostrom-hq/ostrom-core
          ref: chore/conventions
          path: .ostrom-core
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          persist-credentials: false
      - name: GATES modules only (probe)
        run: |
          M="compiler gates receipts sessions"
          T=""; for m in $M; do T="$T :modules:$m:detekt :modules:$m:jvmTest :modules:$m:koverVerify :modules:$m:koverXmlReport :modules:$m:linuxX64Test"; done
          ./gradlew -Postrom.core.local=true -Postrom.core.path=.ostrom-core $T --continue
      - name: Kover reports (probe)
        if: always()
        run: |
          for f in modules/*/build/reports/kover/report.xml; do
            echo "== $f"
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for pkg in root.iter("package"):
              for sf in pkg.iter("sourcefile"):
                  for line in sf.iter("line"):
                      if int(line.get("mi", 0)) > 0 or int(line.get("mb", 0)) > 0:
                          print(pkg.get("name") + "/" + sf.get("name") + ":" + line.get("nr"), "mi=" + line.get("mi"), "mb=" + line.get("mb"))
          PY
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
