# CI of ostrom-server, after ostrom-core's reference template (docs/conventions/.github/workflows/build.yml,
# CONVENTIONS section 11). Pull requests and main, Linux only. Not on version tags: releases are built by the release
# workflow without these caches, which a tag build must never restore (zizmor cache-poisoning).
name: Build
# A run against an ostrom-core branch says so, for squash.sh to find before it squashes a core PR that touches an answer.
run-name: ${{ inputs.core_ref && format('Build against ostrom-core {0}', inputs.core_ref) || '' }}
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # full_validation is kept for the callers that pass it: the server has no native binary any more (docs/decisions/0001),
  # and image.yml builds the arm64 image with jib, without a native link.
  workflow_dispatch:
    inputs:
      full_validation:
        description: No effect since the server runs on the JVM (kept for the callers that pass it)
        type: boolean
        default: false
      # A core PR that touches an answer (schema, status, enum) is squashed only after this server's strict contract
      # test ran green against it: core#96 turned every server PR red with three drifts (JOURNAL 03/11 15:1x).
      core_ref:
        description: The ostrom-core commit (full SHA) whose contract the tests check, instead of gradle/ostrom-core.ref
        type: string
        default: ''
      # A server change that an e2e scenario proves, while main's scenario still waits for it (a temporary skip):
      # play the e2e branch that drops the skip against this pull request's image before the squash.
      e2e_ref:
        description: The ostrom-e2e ref whose scenarios ci-e2e runs, instead of main
        type: string
        default: ''
env:
  KOTLIN_VERSION: '2.4.21'
permissions:
  contents: read
  packages: read # run.ostrom artifacts of ostrom-core on GitHub Packages
# One run per workflow and ref; a new push cancels the previous run, except on main (org CI rules, JOURNAL 03:10).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.core_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # The build in three jobs side by side (the single 40-minute job timed out on #135, with every test green), ci-e2e
  # after ci-image, and `ci`, the required check of main, green only when all four are. A draft pull request runs no
  # CI: mark it ready.
  ci-jvm:
    name: JVM tests, Kover 100 %, detekt, docs and conventions
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ostrom
          POSTGRES_PASSWORD: ostrom
          POSTGRES_DB: ostrom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ostrom" --health-interval 5s --health-timeout 5s --health-retries 20
      # Stripe's official mock, for the billing gateway's integration test.
      stripe-mock:
        image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78 # latest, 2026-10-01
        ports: ['12111:12111']
    env:
      OSTROM_TEST_DATABASE_URL: postgresql://ostrom:ostrom@localhost:5432/ostrom_test
      # Database tests fail instead of being skipped when the service is missing: CI never passes by skipping them.
      OSTROM_TEST_DATABASE_REQUIRED: 'true'
      # Billing: the stripe-mock integration test, and the end-to-end test against the real Stripe test mode (its key
      # is the repository secret STRIPE_TEST_KEY); both fail instead of being skipped here.
      OSTROM_STRIPE_MOCK_URL: http://localhost:12111
      OSTROM_STRIPE_MOCK_REQUIRED: 'true'
      OSTROM_STRIPE_E2E_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      OSTROM_STRIPE_E2E_REQUIRED: 'true'
      # The contract tests (ContractSchema) compare real answers with the pinned ostrom-core's schemas, written as JSON by
      # the contract step below; they fail instead of being skipped here.
      OSTROM_CONTRACT_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One ostrom-core for the whole run (CS-03): the commit gradle/ostrom-core.ref pins, which the Kotlin library is
      # built from too. Only a manual run naming core_ref (squash.sh, before it squashes a core PR) checks another one.
      - name: The ostrom-core commit this run checks against
        id: core
        env:
          CORE_REF: ${{ inputs.core_ref }}
        run: echo "ref=${CORE_REF:-$(tr -d '[:space:]' < gradle/ostrom-core.ref)}" >> "$GITHUB_OUTPUT"
      # docs-truth (ostrom-core's tools/docs-truth) and api/contract/served-routes.txt at that commit; moved out of the
      # workspace, so that no check of this repository scans it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: docs-truth-core
          persist-credentials: false
      - name: The README and docs/ cite only routes main serves and variables the server reads (docs-truth)
        run: |
          mv docs-truth-core "$RUNNER_TEMP/docs-truth-core"
          core="$RUNNER_TEMP/docs-truth-core"
          node "$core/tools/docs-truth/bin/docs-truth.mjs" --routes "$core/api/contract/served-routes.txt" \
            --tests --source . --source "$core/telemetry" README.md docs
      # The contract at that ostrom-core commit against the routes this server mounts, read from the sources (no build): fails
      # for a mounted route the contract lacks and for a `served` operation not mounted; warns for a mounted route
      # still `planned` (the server may merge before core).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: contract-core
          persist-credentials: false
      - name: The mounted routes and the ostrom-core contract agree
        run: |
          mv contract-core "$RUNNER_TEMP/contract-core"
          python3 scripts/check-contract.py --self-test
          python3 scripts/check-contract.py "$RUNNER_TEMP/contract-core"
          # The same contract as JSON, for the tests that check real answers against its schemas (ContractSchema).
          yq -o=json "$RUNNER_TEMP/contract-core/api/openapi.yaml" > "$RUNNER_TEMP/openapi.json"
          echo "OSTROM_CONTRACT_OPENAPI=$RUNNER_TEMP/openapi.json" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-setup
        with:
          core-deploy-key: ${{ secrets.DEPLOY_KEY_CORE }}
          kotlin-version: ${{ env.KOTLIN_VERSION }}
          build-cache: jvm
      - run: python3 scripts/check-conventions.py
      - name: License signing tool (ee/tools/license, 100 % lines and branches)
        working-directory: ee/tools/license
        run: |
          python3 -m venv "$RUNNER_TEMP/license-venv"
          "$RUNNER_TEMP/license-venv/bin/pip" install --quiet --require-hashes -r requirements-ci.txt
          "$RUNNER_TEMP/license-venv/bin/python" -m coverage run --branch --data-file="$RUNNER_TEMP/license.coverage" -m unittest -v test_sign
          "$RUNNER_TEMP/license-venv/bin/python" -m coverage report --data-file="$RUNNER_TEMP/license.coverage" -m --include=sign.py --fail-under=100
      # Coverage first, in its own step, with its gaps printed right after: a runner lost during the native links that
      # follow used to take the coverage report with it (same split as ostrom-cli 0e03e4b and 698cde2).
      - name: detekt, JVM tests with Kover 100 %, all with PostgreSQL
        run: ./gradlew --continue detekt jvmTest koverXmlReport koverVerify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gradle's build cache, saved from main only (a pull request restores, never writes)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-jvm-${{ github.sha }}
      - name: Lines and branches not covered
        if: failure()
        run: python3 scripts/uncovered.py
      # The times the benches measured, against their budgets: reported, never blocking. A Build fails on what no
      # runner's load changes (queries per call, plans, rows read) and on a time only past ten times its budget
      # (TimeBudget.kt); perf.yml holds the budgets, on the median of three runs.
      - name: Measured times and their budgets (reported, held by perf.yml)
        if: success() || failure()
        run: |
          python3 scripts/perf-budgets.py --self-test
          python3 scripts/k6-thresholds.py --self-test
          python3 scripts/perf-budgets.py summary . | tee -a "$GITHUB_STEP_SUMMARY"
      # Every served operation that answers JSON was seen answering by a test, so ContractObserver checked it against
      # the contract (or contract/unobserved-operations.txt says why not); prints the drifts the tests met.
      - name: Every served operation's answer was checked against the contract
        if: success() || failure()
        run: |
          python3 scripts/check-contract-coverage.py --self-test
          python3 scripts/check-contract-coverage.py "$RUNNER_TEMP/openapi.json" contract/unobserved-operations.txt \
            testing/src/commonMain/kotlin/run/ostrom/server/testing/KnownDrifts.kt .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: '**/build/reports/**'
          retention-days: 7

  # The session runner (runner/) is the one Kotlin/Native program left (docs/decisions/0001): its tests run natively.
  ci-native:
    name: Runner native tests (linuxX64)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-setup
        with:
          core-deploy-key: ${{ secrets.DEPLOY_KEY_CORE }}
          kotlin-version: ${{ env.KOTLIN_VERSION }}
          build-cache: native
      # From here, two Gradle workers at a time: several Kotlin/Native compilations and links at once exhaust the
      # runner's memory (#13, exit 143 while linking linuxArm64).
      - name: Two Gradle workers for the native builds
        if: ${{ !cancelled() }}
        run: echo 'org.gradle.workers.max=2' >> ~/.gradle/gradle.properties
      - name: Runner native tests (linuxX64)
        if: ${{ !cancelled() }}
        run: ./gradlew --continue :runner:linuxX64Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Measured times and their budgets (reported, held by perf.yml)
        if: success() || failure()
        run: python3 scripts/perf-budgets.py summary . | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gradle's build cache, saved from main only (a pull request restores, never writes)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-native-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-native
          path: '**/build/reports/**'
          retention-days: 7

  # The server image (jib, the JVM application of docs/decisions/0001), the session image, the server image's smoke tests
  # against PostgreSQL, then the Apache-2.0 build.
  ci-image:
    name: Binary, images and smoke tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ostrom
          POSTGRES_PASSWORD: ostrom
          POSTGRES_DB: ostrom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ostrom" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-setup
        with:
          core-deploy-key: ${{ secrets.DEPLOY_KEY_CORE }}
          kotlin-version: ${{ env.KOTLIN_VERSION }}
          build-cache: image
      # The image image.yml publishes, built the same way for this runner's architecture into the local daemon.
      - name: Server image (jib, amd64, into Docker)
        run: |
          ./gradlew :image:publishImageToLocalRegistry -PimageTags=ci -PimagePlatforms=amd64
          docker images ostrom-server:ci --format '{{.Size}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # From here, two Gradle workers at a time: several Kotlin/Native compilations and links at once exhaust the
      # runner's memory (#13, exit 143 while linking linuxArm64).
      - name: Two Gradle workers for the native builds
        if: ${{ !cancelled() }}
        run: echo 'org.gradle.workers.max=2' >> ~/.gradle/gradle.properties
      # A private repository's runner has 7 GB: the Gradle and Kotlin daemons of the image build still hold much of it,
      # and native links were killed (exit 143) even with #52's lighter daemons. Stop them, and add swap where the disk
      # has room, before the runner's native link.
      - name: Free memory for the native links
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          df -h / /mnt
          # Swap where the disk has room (the runner's /mnt can be too small): stopping the daemons is the main fix.
          for size in 4G 2G; do
            if sudo fallocate -l "$size" /native-link.swap; then
              sudo chmod 600 /native-link.swap
              sudo mkswap /native-link.swap
              sudo swapon /native-link.swap
              break
            fi
          done
          free -h
      # The swap file takes the root disk the images need (run 41029912954: "no space left on device" pulling the
      # collector): give it back once the links are done.
      - name: Release the swap of the native links
        if: ${{ !cancelled() }}
        run: |
          sudo swapoff /native-link.swap || true
          sudo rm -f /native-link.swap
          df -h /
      # After the swap is given back: the agents' CLIs take the disk the swap held (runs 41045488208, three tries).
      - name: Cache the npm tarballs of the session image's agents
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ostrom-agents-npm
          key: agents-npm-${{ hashFiles('runner/agents/package-lock.json') }}
      # S2-49: one session of the real image, run as the Docker driver runs it; the agent must not reach the token.
      - name: Session image, the agent cannot read the runner token (S2-49)
        if: ${{ !cancelled() }}
        run: |
          export SESSION_IMAGE_NPM_CACHE="$HOME/.cache/ostrom-agents-npm"
          ci/warm-agents-npm-cache.sh "$SESSION_IMAGE_NPM_CACHE"
          ./gradlew :runner:linkDebugExecutableLinuxX64
          ci/runner-isolation.sh runner/build/bin/linuxX64/debugExecutable/ostrom-runner.kexe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The image this pull request builds, for ci-e2e: ostrom-e2e main runs against it before the merge, not after.
      - name: Save the image for ci-e2e
        run: |
          docker save ostrom-server:ci | gzip -1 > "$RUNNER_TEMP/ostrom-server-image.tar.gz"
          ls -lh "$RUNNER_TEMP/ostrom-server-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostrom-server-image
          path: ${{ runner.temp }}/ostrom-server-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      # As deployed: the owner migrates, the server serves as a role that owns nothing (ci/database-roles.sql).
      - name: Smoke test of the image (roles, migrate, /ready, /api/v1/instance, graceful SIGTERM)
        env:
          PGPASSWORD: ostrom
          OWNER_URL: postgresql://ostrom_owner:ostrom_owner@localhost:5432/ostrom
          APP_URL: postgresql://ostrom_app:ostrom_app@localhost:5432/ostrom
        run: |
          psql -h localhost -U ostrom -d ostrom_test -v ON_ERROR_STOP=1 -f ci/database-roles.sql
          # Runs the image, expects exit code $1 and the text $2 in its output.
          expect() {
            local code="$1" text="$2"; shift 2
            local status=0 out
            out=$(docker run --rm --network host "$@" 2>&1) || status=$?
            echo "$out"
            test "$status" -eq "$code" && grep -q "$text" <<<"$out"
          }
          expect 1 MigrationsNotAppliedException -e OSTROM_DATABASE_URL="$APP_URL" ostrom-server:ci
          expect 0 'migrations done' -e OSTROM_DATABASE_MIGRATION_URL="$OWNER_URL" ostrom-server:ci migrate
          expect 0 'migrations done' -e OSTROM_DATABASE_MIGRATION_URL="$OWNER_URL" ostrom-server:ci migrate
          # AUDIT-RLS R8: the migrations' history is read, never written, by any role but its owner.
          read -r histories writable < <(psql "$OWNER_URL" -At -F ' ' -v ON_ERROR_STOP=1 -c "SELECT count(*),
            count(*) FILTER (WHERE EXISTS (SELECT 1 FROM unnest(ARRAY['ostrom_app', 'ostrom_tenant', 'public']) r
              WHERE has_table_privilege(r, c.oid, 'INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER')
                 OR has_any_column_privilege(r, c.oid, 'INSERT, UPDATE, REFERENCES')))
            FROM pg_class c WHERE c.relkind = 'r' AND c.relnamespace = 'public'::regnamespace
              AND c.relname LIKE '\_migrations\_%'")
          echo "migration histories: $histories, writable by another role: $writable"
          [ "$histories" -gt 0 ] || { echo "no migrations' history"; exit 1; }
          [ "$writable" -eq 0 ] || { echo "a migrations' history is writable by another role"; exit 1; }
          expect 1 UnsafeDatabaseRoleException -e OSTROM_DATABASE_URL=postgresql://ostrom:ostrom@localhost:5432/ostrom \
            ostrom-server:ci
          expect 1 UnsafeDatabaseRoleException -e OSTROM_DATABASE_URL="$OWNER_URL" ostrom-server:ci
          expect 2 OSTROM_ALLOW_TEST_ACCOUNTS -e OSTROM_DATABASE_URL="$APP_URL" ostrom-server:ci \
            seed-test-account qa@ostrom.test
          # TC-CODE-AUTH-2: an invite-only instance without an account prints the first owner's setup link on demand.
          expect 0 '/setup#token=osb_' -e OSTROM_DATABASE_URL="$APP_URL" ostrom-server:ci bootstrap
          docker run -d --name ostrom --network host --memory 1g -e OSTROM_DATABASE_URL="$APP_URL" \
            -e OSTROM_SHUTDOWN_DELAY_SECONDS=1 -e OSTROM_SHUTDOWN_GRACE_SECONDS=600 ostrom-server:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/ready && break; sleep 1; done
          echo
          curl -fsS localhost:8080/ready | grep '"status":"ready"'
          curl -fsS localhost:8080/health | grep '"status":"ok"'
          curl -fsS localhost:8080/api/v1/instance | grep '"algorithm":"ed25519"'
          docker stop -t 30 ostrom
          docker logs ostrom
          # SD-09: the drain says how long it waits for the calls in flight, the chart's 600 s (none here: it stops at
          # once).
          docker logs ostrom 2>&1 | grep '"msg":"server draining"' | grep '"signal":"SIGTERM"' | grep '"grace_s":600'
          docker logs ostrom 2>&1 | grep '"msg":"server stopped"'
          # The start says how to bootstrap the instance, and never logs a setup link.
          docker logs ostrom 2>&1 | grep -q 'run `ostrom-server bootstrap`'
          if docker logs ostrom 2>&1 | grep -q 'osb_'; then echo "a setup link was logged" >&2; exit 1; fi
          # The JVM's heap follows the container's limit (the image's JAVA_TOOL_OPTIONS, MaxRAMPercentage=70 of 1g).
          starting=$(docker logs ostrom 2>&1 | grep '"msg":"server starting"')
          echo "$starting" | grep -q '"runtime":"jvm 21' || { echo "not the JVM: $starting"; exit 1; }
          heap=$(echo "$starting" | sed -n 's/.*"max_heap_mib":\([0-9]*\).*/\1/p')
          [ "$heap" -gt 600 ] && [ "$heap" -le 720 ] || { echo "the heap does not follow the limit: $starting"; exit 1; }
          test "$(docker inspect -f '{{.State.ExitCode}}' ostrom)" -eq 0
      - name: Smoke test of the license check (an invalid key fails the start, without logging the key)
        env:
          APP_URL: postgresql://ostrom_app:ostrom_app@localhost:5432/ostrom
        run: |
          set +e
          docker run --name ostrom-bad-license --network host -e OSTROM_DATABASE_URL="$APP_URL" \
            -e OSTROM_PORT=8081 -e OSTROM_LICENSE_KEY=ostrom-license.v1.not-a-license \
            ostrom-server:ci > license.log 2>&1
          status=$?
          set -e
          cat license.log
          test "$status" = 1
          grep -q 'The license key is malformed' license.log
          if grep -q 'not-a-license' license.log; then echo "The key was logged." >&2; exit 1; fi
      - name: Telemetry reaches an OpenTelemetry collector (traces, metrics, logs)
        timeout-minutes: 5
        env:
          OSTROM_SMOKE_DATABASE_URL: postgresql://ostrom_app:ostrom_app@localhost:5432/ostrom
        run: ci/otel-smoke.sh
      # TC-REP-7, TeamCode's scripts/smoke-replicas.py: two server processes on one database.
      - name: Two replicas on one database (start, shared tokens, a kill, a database outage, a revocation)
        timeout-minutes: 8
        env:
          OSTROM_SMOKE_DATABASE_URL: postgresql://ostrom_app:ostrom_app@localhost:5432/ostrom
        run: ci/replicas-smoke.sh
      - name: Server logs on failure
        if: failure()
        run: |
          docker logs ostrom || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-image
          path: '**/build/reports/**'
          retention-days: 7
      # Last, because it deletes ee/ from the checkout: the Apache-2.0 build must compile without the enterprise code, and
      # nothing outside ee/ may name it (app/build.gradle.kts generates the only reference, from ee/ itself).
      - name: Apache-2.0 build without ee/
        run: |
          if grep -rn "dev\.ostrom\.server\.ee\." --include='*.kt' --include='*.kts' --exclude-dir=build app kernel modules testing; then
            echo "Code outside ee/ references the enterprise modules." >&2
            exit 1
          fi
          rm -rf ee
          ./gradlew :app:compileKotlinJvm
          grep -q 'listOf<ServerModule>($' app/build/generated/ee-modules/kotlin/run/ostrom/server/app/EeModules.kt
          if grep -q 'LicenseModule' app/build/generated/ee-modules/kotlin/run/ostrom/server/app/EeModules.kt; then
            echo "The Apache-2.0 build still registers an enterprise module." >&2
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gradle's build cache, saved from main only (a pull request restores, never writes)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-image-${{ github.sha }}

  # ostrom-e2e main (the isolation sweep, every scenario but the TeamCode import, a short k6 of the gates) against the
  # image ci-image built: a pull request that changes an answer fails here, before the merge, and brings its e2e fix
  # along, or an e2e pull request merged first (AGENTS.md, « End-to-end before the merge »).
  ci-e2e:
    needs: [ci-image]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-journey.yml
    with:
      image_artifact: ostrom-server-image
      e2e_ref: ${{ inputs.e2e_ref || 'main' }}
    secrets: inherit

  # The API package (CS-02, ostrom-core docs/decisions/0001-generated-openapi.md): the server's OpenAPI document
  # (openapi.json) and its TypeScript types, built on every run and published from main as @ostrom-hq/openapi
  # 0.1.<run> once `ci` is green. The web console and the site generate their clients from it. Until the server
  # generates the document from its own routes (ktor-server-routing-openapi, on the JVM), it is the contract of the
  # ostrom-core this server pins (gradle/ostrom-core.ref).
  api-package:
    name: API package (@ostrom-hq/openapi)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The ostrom-core commit this server pins
        id: core
        run: echo "ref=$(tr -d '[:space:]' < gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: contract-core
          sparse-checkout: api/openapi.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The OpenAPI document
        run: |
          mv contract-core "$RUNNER_TEMP/contract-core"
          yq -o=json "$RUNNER_TEMP/contract-core/api/openapi.yaml" > api-package/openapi.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api-package/package-lock.json
      - name: Build and pack @ostrom-hq/openapi 0.1.<run>
        working-directory: api-package
        env:
          VERSION: 0.1.${{ github.run_number }}
          CORE: ${{ steps.core.outputs.ref }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm version --no-git-tag-version "$VERSION"
          npm pack
          echo "- API package: @ostrom-hq/openapi $VERSION (contract of ostrom-core $CORE)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-package
          path: api-package/ostrom-hq-openapi-*.tgz
          retention-days: 7

  # From main only, after the required check: the package built above, as is.
  api-package-publish:
    name: Publish @ostrom-hq/openapi
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@ostrom-hq'
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish ostrom-hq-openapi-*.tgz
          echo "Published $(ls ostrom-hq-openapi-*.tgz)" >> "$GITHUB_STEP_SUMMARY"

  # The required check of main, still named `ci` (branch protection, .coord/squash.sh).
  ci:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [ci-jvm, ci-native, ci-image, ci-e2e, api-package]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Every part of the build passed
        env:
          JVM: ${{ needs.ci-jvm.result }}
          NATIVE: ${{ needs.ci-native.result }}
          IMAGE: ${{ needs.ci-image.result }}
          E2E: ${{ needs.ci-e2e.result }}
          API: ${{ needs.api-package.result }}
        run: |
          echo "JVM tests and Kover: $JVM; runner native tests: $NATIVE; binary, images and smoke tests: $IMAGE; e2e: $E2E; API package: $API"
          test "$JVM" = success && test "$NATIVE" = success && test "$IMAGE" = success && test "$E2E" = success && test "$API" = success
