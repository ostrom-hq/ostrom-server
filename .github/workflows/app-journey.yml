name: App journey

# The mobile app's flows against the real server (ostrom-app .maestro/real/, demo/PARCOURS.md 6.7) on a PUBLISHED image
# of this server: by default `sha-<7>` of main's head, never `edge`, which a slower run of an older commit may still
# hold. The app is built here from ostrom-app (a release APK for an x86_64 emulator, signed in with a personal token the
# job makes for a new person of a new organization) and its Maestro flows run on an Android emulator of this same Linux
# runner: the server runs on the host, the emulator reaches it at 10.0.2.2. It runs in this repository because its
# token reads its own GHCR packages, which ostrom-app's cannot yet (as cli-journey.yml and console-journey.yml). On
# demand, and, off the org's one-`ci`-job rule on purpose (as demo-stack.yml), on a pull request only when the pull
# request changes this file.
on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Server image (empty = ghcr.io/ostrom-hq/ostrom-server:sha-<7> of main's head)
        default: ""
      app_ref:
        description: ostrom-app ref whose app and flows run
        default: main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [.github/workflows/app-journey.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  journey:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # The database is `ostrom_ci`: ci/database-roles.sql creates `ostrom` itself, owned by its owner role.
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env: { POSTGRES_USER: ostrom, POSTGRES_PASSWORD: ostrom, POSTGRES_DB: ostrom_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom_ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_REF: ${{ inputs.app_ref || 'main' }}
      WANTED_IMAGE: ${{ inputs.server_image }}
    steps:
      # The whole history: main's head names the image, and the image's own commit gives its database roles.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: server
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-app
          ref: ${{ env.APP_REF }}
          ssh-key: ${{ secrets.DEPLOY_KEY_APP }}
          path: app
          persist-credentials: false
      - name: The server image (sha-<7> of main's head unless named)
        id: server
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          main=$(git -C server rev-parse origin/main)
          image=${WANTED_IMAGE:-ghcr.io/ostrom-hq/ostrom-server:sha-${main:0:7}}
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull --quiet "$image" || { echo "::error::$image cannot be pulled (not published yet?)"; exit 1; }
          revision=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          [ -n "$revision" ] || { echo "::error::$image carries no org.opencontainers.image.revision label"; exit 1; }
          # The database roles of the image's own commit, not of a main that may have moved past it.
          git -C server show "${revision}:ci/database-roles.sql" > "$RUNNER_TEMP/database-roles.sql"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "### Images"
            echo "- server: \`$image\` (ostrom-server@${revision:0:7}; main is at ${main:0:7})"
            echo "- app: ostrom-app $(git -C app rev-parse --short HEAD) ($APP_REF), built here"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the server (roles, migrate, serve as ostrom_app)
        env:
          IMAGE: ${{ steps.server.outputs.image }}
          PGPASSWORD: ostrom
          OWNER_URL: postgresql://ostrom_owner:ostrom_owner@localhost:5432/ostrom
        run: |
          psql -h localhost -U ostrom -d ostrom_ci -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/database-roles.sql"
          docker run --rm --network host -e OSTROM_DATABASE_MIGRATION_URL="$OWNER_URL" "$IMAGE" migrate
          # The server's non-root user writes the mails (0644); the session script, as the runner's user, reads them.
          mkdir -p "$RUNNER_TEMP/ostrom-mail" && chmod 0777 "$RUNNER_TEMP/ostrom-mail"
          # Test values only: sign-in mails are written to a directory, Stripe is never called by the flows.
          cat > "$RUNNER_TEMP/server.env" <<'ENV'
          OSTROM_DATABASE_URL=postgresql://ostrom_app:ostrom_app@localhost:5432/ostrom
          OSTROM_PORT=4600
          OSTROM_MAIL_DIR=/var/lib/ostrom/mail
          OSTROM_PUBLIC_URL=http://127.0.0.1:4600
          OSTROM_CONSOLE_URL=http://127.0.0.1:4600
          OSTROM_STRIPE_SECRET_KEY=sk_test_app_e2e
          OSTROM_STRIPE_WEBHOOK_SECRET=whsec_app_e2e
          OSTROM_STRIPE_API_BASE=http://127.0.0.1:12111
          ENV
          sed -i 's/^ *//' "$RUNNER_TEMP/server.env"
          docker run -d --name ostrom-server --network host -v "$RUNNER_TEMP/ostrom-mail:/var/lib/ostrom/mail" \
            --env-file "$RUNNER_TEMP/server.env" "$IMAGE"
          for _ in $(seq 1 60); do curl -fsS 127.0.0.1:4600/ready >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs ostrom-server; exit 1
      - name: A person, an organization and a token on the server
        id: session
        # The script masks the token and writes token= and login= to $GITHUB_OUTPUT itself.
        run: app/scripts/real-server-session.sh http://127.0.0.1:4600 "$RUNNER_TEMP/ostrom-mail"
      - name: The session gave a token and a login
        env:
          TOKEN: ${{ steps.session.outputs.token }}
          LOGIN: ${{ steps.session.outputs.login }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$LOGIN" ]; then
            echo "::error::The session step gave no token or no login: the app would stop at launch"
            exit 1
          fi
      - name: The member the app signs in as, seen with and without Ostrom-Org
        # The app reads no role from /auth/me (it gates the yes on the approval's `you.canApprove`, which the gates
        # resolve for the only organization without the header, server#64); this keeps the contract's case in the
        # journey: with `Ostrom-Org`, /auth/me gives the owner's membership; without it, none (core#51).
        env:
          TOKEN: ${{ steps.session.outputs.token }}
        run: |
          auth=(-H "accept: application/json" -H "authorization: Bearer $TOKEN")
          org="$(curl -fsS "${auth[@]}" http://127.0.0.1:4600/api/v1/me/organizations | jq -er '.items | if length == 1 then .[0].id else error("not one organization") end')"
          role="$(curl -fsS "${auth[@]}" -H "Ostrom-Org: $org" http://127.0.0.1:4600/api/v1/auth/me | jq -r '.member.role // ""')"
          if [ "$role" != "owner" ]; then
            echo "::error::/auth/me with Ostrom-Org gave the role \"$role\", not owner"
            exit 1
          fi
          bare="$(curl -fsS "${auth[@]}" http://127.0.0.1:4600/api/v1/auth/me | jq -r '.member.role // "none"')"
          echo "With Ostrom-Org: $role; without: $bare"
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome \
            /usr/local/share/powershell /usr/local/share/chromium
          free_kib=$(df --output=avail -k / | tail -n 1)
          echo "Free on / after the cleanup: $((free_kib / 1024 / 1024)) GiB"
          if [ "$free_kib" -lt $((8 * 1024 * 1024)) ]; then
            echo "::error::Less than 8 GiB free after the cleanup: the build and the emulator would not fit"
            exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's dependencies
        working-directory: app
        run: npm ci
      # The emulator reaches the runner at 10.0.2.2, over plain HTTP: allowed in this build only, never in a store build.
      - name: Build the Android app against the server (release, x86_64)
        working-directory: app
        env:
          EXPO_PUBLIC_OSTROM_REAL_E2E: "1"
          EXPO_PUBLIC_OSTROM_E2E_SERVER: http://10.0.2.2:4600
          EXPO_PUBLIC_OSTROM_E2E_TOKEN: ${{ steps.session.outputs.token }}
          EXPO_PUBLIC_OSTROM_E2E_LOGIN: ${{ steps.session.outputs.login }}
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro (pinned)
        env:
          MAESTRO_VERSION: 2.12.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: The app's flows against the server
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          OSTROM_E2E_LOGIN: ${{ steps.session.outputs.login }}
        with:
          working-directory: app
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            scripts/run-maestro.sh .maestro/real -e OSTROM_E2E_LOGIN="$OSTROM_E2E_LOGIN"
      - name: Server logs
        if: always()
        run: docker logs ostrom-server 2>&1 | tail -n 300 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: app-journey-report
          path: |
            app/maestro-report-*.xml
            app/maestro-output/
          if-no-files-found: ignore
          retention-days: 7
