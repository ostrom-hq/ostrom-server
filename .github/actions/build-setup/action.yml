# The setup every job of ci.yml shares before Gradle runs.
name: Build setup
description: >-
  ostrom-core at the pinned commit next to the workspace, Java 21, Gradle, the Kotlin/Native toolchain, tests never
  served from the cache, and Gradle's memory sized for the runner.
inputs:
  core-deploy-key:
    description: The read-only deploy key of ostrom-core (secret DEPLOY_KEY_CORE).
    required: true
  kotlin-version:
    description: The Kotlin version, part of the Kotlin/Native cache key.
    required: true
  build-cache:
    description: >-
      The job's name in the key of Gradle's build cache (jvm, native, image): restored from main's latest, saved by
      the job on main only, by a push or a manual run (actions/cache/save after its Gradle steps).
    required: true
runs:
  using: composite
  steps:
    # ostrom-core at the pinned commit, read with its read-only deploy key: the GITHUB_TOKEN of this repository can
    # never read the Maven packages of another one (JOURNAL 05:50). Moved next to the workspace, where
    # settings.gradle.kts includes it (ostrom.core.local), so that no check of this repository scans it.
    - name: ostrom-core version
      id: core
      shell: bash
      run: echo "ref=$(tr -d '[:space:]' < gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ostrom-hq/ostrom-core
        ref: ${{ steps.core.outputs.ref }}
        ssh-key: ${{ inputs.core-deploy-key }}
        path: ostrom-core
        persist-credentials: false
    - name: Build ostrom-core from that checkout
      shell: bash
      run: |
        mv ostrom-core ../ostrom-core
        mkdir -p ~/.gradle
        echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: basic
    # Gradle's build cache, task outputs by their inputs (tests are never cached, below). setup-gradle's basic cache
    # keys ~/.gradle/caches on the build files only, so its build-cache-1 stayed frozen: 12 of 400 tasks came from it
    # (run 41663816307). This one moves with main: each green main run saves it, every run restores main's latest.
    # Only main writes it: at ~1.9 GB a save against the repository's 10 GB, saves from twenty active branches would
    # evict main's within hours. A pull request restores, read-only.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gradle-build-cache-${{ inputs.build-cache }}-${{ github.sha }}
        restore-keys: gradle-build-cache-${{ inputs.build-cache }}-
    # The Kotlin/Native toolchain and its dependencies (~1 GB) are not in the Gradle cache.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ inputs.kotlin-version }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ inputs.kotlin-version }}-
    - name: Never serve a test task from the cache
      shell: bash
      run: |
        mkdir -p ~/.gradle/init.d
        cat > ~/.gradle/init.d/always-run-tests.init.gradle.kts <<'KTS'
        allprojects {
            tasks.withType<AbstractTestTask>().configureEach {
                outputs.cacheIf { false }
                outputs.upToDateWhen { false }
            }
        }
        KTS
    # One Gradle daemon (4 GB) and one Kotlin daemon (2 GB) fit the runner with PostgreSQL and stripe-mock; the 6 GB of
    # gradle.properties, meant for a workstation, plus the Kotlin daemon got runners killed (exit 143) while linking.
    - name: Gradle memory for this runner
      shell: bash
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'PROPS'
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        kotlin.daemon.jvmargs=-Xmx2g
        PROPS
